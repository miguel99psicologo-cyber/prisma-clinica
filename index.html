function caseCard(c){let count=closedSessions(c.id).length,assigned=isAssigned(c.id);return `<article class="case-card"><div class="case-card-top">${avatar(c)}<div style="flex:1;min-width:0"><h4>${h(c.name)}</h4><div class="age">${c.age} años · ${h(c.occupation)}</div></div><span class="pill ${assigned?'green':''}">${assigned?'Asignado':'Nuevo'}</span></div><span class="pill" style="margin-bottom:10px">${h(c.topic)}</span><p>${h(c.description)}</p><div class="case-footer"><span>${count} ${count===1?'sesión':'sesiones'} · ${h(c.difficulty)}</span><button data-action="patient" data-id="${c.id}">Ver consultante ${ico('chevron',13)}</button></div></article>`}
function dash(){let closed=state.sessions.filter(x=>x.status==='closed');let assigned=Object.keys(state.patients).length;let recent=closed.slice().sort((a,b)=>b.ended.localeCompare(a.ended)).slice(0,4);let nick=getName()==='Terapeuta en formación'?'':' '+getName().split(' ')[0];return header('Buenos días'+h(nick),'Tu espacio de práctica y evaluación de habilidades clínicas.')+`<section class="hero"><div><span class="hero-kicker">SIMULACIÓN CLÍNICA · FORMACIÓN</span><h2>Aprender también es practicar.</h2><p>Explora casos sintéticos, conduce entrevistas en un entorno seguro y observa cómo se desarrolla cada proceso psicoterapéutico.</p><button class="btn" data-action="go" data-page="library">${ico('plus')} Comenzar nueva práctica</button></div><div class="hero-art"><span class="hero-sparks"></span><span class="ring"></span><div class="hero-panel"><span>Progreso formativo</span><strong>6 fases clínicas</strong><div style="display:flex;gap:3px;margin-top:9px">${Array(6).fill('<span style="background:#66cbb8;height:5px;flex:1;border-radius:4px"></span>').join('')}</div></div></div></section><section class="stats">${metric('Consultantes disponibles',CASES.length,'Perfiles clínicos ficticios','users')}${metric('Mis consultantes',assigned,'Casos que has comenzado','book')}${metric('Sesiones completadas',closed.length,'Entrevistas cerradas','check')}${metric('Fases exploradas',new Set(closed.map(s=>s.phase)).size,'De 6 etapas posibles','target')}</section><div class="section-head"><h3>Consultantes para explorar</h3><button class="small-link" data-action="go" data-page="library">Ver biblioteca ${ico('arrow',13)}</button></div><div class="card-grid">${CASES.slice(0,3).map(caseCard).join('')}</div><section class="two-col" style="margin-top:20px"><div class="panel"><div class="panel-title"><h3>Actividad reciente</h3><button class="small-link" data-action="go" data-page="history">Ver historial</button></div>${recent.length?recent.map(s=>{let c=caseById(s.patientId);return `<div class="activity-row">${avatar(c)}<div class="activity-body"><b>Sesión ${s.number} · ${h(c.name)}</b><p>${h(s.phase)} · ${s.messages.filter(x=>x.role==='therapist').length} intervenciones</p></div><time>${dateFormat(s.ended)}</time></div>`}).join(''):`<div class="empty">${ico('history',28)}<b>Aún no has cerrado sesiones</b><span>Después de tu primera práctica, aquí aparecerán las sesiones completadas.</span></div>`}</div><div class="panel"><div class="panel-title"><h3>Cómo funciona</h3></div><div class="workflow">${[['01','Selecciona un consultante','Explora su ficha y motivo de consulta.'],['02','Realiza la entrevista','Practica preguntas y otras intervenciones.'],['03','Evalúa la sesión','Revisa transcripción, rúbrica y evolución.']].map(x=>`<div class="workflow-step"><span class="num">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div></div></section>`}
function library(assignedOnly=false){let cats=['Todas',...new Set(CASES.map(c=>c.category))];let items=CASES.filter(c=>(!assignedOnly||isAssigned(c.id))&&(category==='Todas'||c.category===category)&&(difficultyFilter==='Todas'||c.difficulty===difficultyFilter)&&(`${c.name} ${c.topic} ${c.occupation} ${c.description}`.toLowerCase().includes(query.toLowerCase())));let act=`<button class="btn btn-primary" data-action="go" data-page="library">${ico('plus')} Explorar biblioteca</button>`;return header(assignedOnly?'Mis consultantes':'Biblioteca de consultantes',assignedOnly?'Casos que has iniciado, con sus sesiones y su evolución.':'Casos ficticios para entrenar habilidades de entrevista e intervención psicoterapéutica.',assignedOnly?act:'')+`<div class="toolbar"><label class="searchbox">${ico('search')}<input id="case-search" type="search" placeholder="Buscar por nombre, dificultad o motivo..." value="${h(query)}" aria-label="Buscar consultantes"></label><select class="selector" id="category-select" aria-label="Filtrar categoría">${cats.map(cat=>`<option value="${h(cat)}" ${category===cat?'selected':''}>${h(cat==='Todas'?'Todas las áreas':cat)}</option>`).join('')}</select><select class="selector" id="difficulty-select" aria-label="Filtrar dificultad">${['Todas','Básico','Intermedio','Avanzado'].map(d=>`<option value="${d}" ${difficultyFilter===d?'selected':''}>${d==='Todas'?'Toda dificultad':d}</option>`).join('')}</select><span class="result-count">${items.length} ${items.length===1?'consultante':'consultantes'}</span></div>${items.length?`<div class="card-grid">${items.map(caseCard).join('')}</div>`:`<div class="panel"><div class="empty">${ico('search',30)}<b>Sin resultados</b><span>Cambia los filtros o explora la biblioteca completa.</span><button class="btn btn-secondary" data-action="reset-filters">Limpiar filtros</button></div></div>`}`}

function patientDetail(){let c=caseById(selectedPatient);if(!c)return dash();let sessions=patientSessions(c.id),active=activeSession(c.id),closed=closedSessions(c.id),val=latestState(c.id);return header('Ficha del consultante','Información contextual de un personaje completamente ficticio.',`<button class="btn btn-secondary" data-action="go" data-page="library">${ico('back')} Volver</button><button class="btn btn-primary" data-action="start" data-id="${c.id}">${ico(active?'play':'plus')}${active?'Continuar sesión':'Iniciar sesión'}</button>`)+`<div class="detail-layout"><div><section class="panel"><div class="patient-cover">${avatar(c,'large')}<div><h2 class="patient-name">${h(c.name)}</h2><div class="patient-meta">${c.age} años · ${h(c.occupation)}</div><div style="margin-top:11px"><span class="pill green">${h(c.topic)}</span> <span class="pill">${h(c.difficulty)}</span></div></div></div><div class="label-grid"><div class="datum"><small>Área de práctica</small><b>${h(c.category)}</b></div><div class="datum"><small>Sesiones completadas</small><b>${closed.length}</b></div><div class="datum"><small>Etapa actual</small><b>${h(state.patients[c.id]?.phase||PHASES[0])}</b></div><div class="datum"><small>Estado</small><b>${active?'Sesión en curso':sessions.length?'En seguimiento':'No asignado'}</b></div></div><div class="divider"></div><span class="eyebrow">MOTIVO DE CONSULTA</span><p class="detail-text">${h(c.description)}</p><span class="eyebrow">ANTECEDENTES RELEVANTES</span><p class="detail-text">${h(c.history)}</p><span class="eyebrow">CONTEXTO VITAL</span><p class="detail-text">${h(c.context)}</p><div class="notice">${ico('info',16)} Caso de ficción. La información no representa la historia clínica de una persona real. Otros aspectos del caso se exploran en la entrevista.</div></section><section class="panel" style="margin-top:16px"><div class="panel-title"><h3>Sesiones de este proceso</h3></div>${sessions.length?`<div class="table-wrap"><table class="session-table"> function startSession(id){let c=caseById(id);if(!c){toast('El caso no existe.',true);return}let existing=activeSession(id);if(existing){selectedPatient=id;page='simulation';render();return}let profile=state.patients[id]||{phase:PHASES[0],difficulty:state.profile.difficulty};state.patients[id]=profile;let prior=closedSessions(id).at(-1),event=prior?.event||null;let opening=prior?'Hola. Quería contarte qué ha pasado desde la última vez que nos vimos.':c.opening;let s={id:uid(),patientId:id,number:patientSessions(id).length+1,phase:profile.phase,difficulty:profile.difficulty,started:new Date().toISOString(),ended:null,status:'active',dimensions:latestState(id),messages:[{id:uid(),role:'patient',text:opening,at:new Date().toISOString()}],turns:[],trajectories:[latestState(id)],leadInEvent:event,review:null,summary:null};state.sessions.push(s);state.active[id]=s.id;save();selectedPatient=id;page='simulation';render()}

function chatBubble(msg,c){return `<div class="bubble-row ${msg.role==='therapist'?'mine':''}" role="group" aria-label="Mensaje de ${msg.role==='therapist'?'terapeuta':'consultante ' + h(c.name)}">${msg.role==='patient'?avatar(c):''}<div class="bubble">${h(msg.text).replace(/\n/g,'<br>')}<span class="msg-time">${timeFormat(msg.at)}</span></div></div>`}
function simView(){let s=currentSession();if(!s)return `<div class="empty">No hay ninguna sesión abierta. <button class="btn btn-primary" data-action="go" data-page="library">Ver biblioteca</button></div>`;let c=caseById(s.patientId),phaseIdx=PHASES.indexOf(s.phase);return `<div class="page-head" style="margin-bottom:18px"><div><h1 class="page-title">Sala de simulación</h1><p class="subheading">Entrevista de entrenamiento · Sesión ${s.number} · ${h(c.name)}</p></div><div class="page-actions"><button class="btn btn-secondary btn-small" data-action="patient" data-id="${c.id}">${ico('back')} Ficha del caso</button><button class="btn btn-danger btn-small" data-action="finish-confirm">${ico('check')} Cerrar sesión</button></div></div><div class="sim-shell"><div class="sim-main"><div class="sim-header"><div class="sim-person">${avatar(c)}<div><h3>${h(c.name)}</h3><small>${c.age} años · ${h(c.topic)}</small></div></div><div class="sim-controls"><span class="pill green">Sesión ${s.number}</span></div></div><div class="phase-bar"><div class="phase-heading"><b>${h(s.phase)}</b><span>Etapa ${phaseIdx+1} de 6</span></div><div class="phase-steps">${PHASES.map((_,i)=>`<span class="phase-point ${i<phaseIdx?'done':i===phaseIdx?'current':''}"></span>`).join('')}</div></div><div class="chat-area" id="chat-scroll" role="log" aria-label="Conversación simulada" aria-live="off"><div class="chat-hint">${ico('shield',13)} Entorno simulado · No utilices datos de pacientes reales</div>${s.messages.map(m=>chatBubble(m,c)).join('')}<div id="typing" class="bubble-row hide">${avatar(c)}<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div></div><form class="composer" id="chat-form"><div class="compose-row"><textarea id="message-input" maxlength="1800" placeholder="Escribe tu intervención como terapeuta..." aria-label="Escribe tu intervención" ${isSending?'disabled':''} required></textarea><button class="send-btn" id="chat-send" title="Enviar intervención" aria-label="Enviar intervención" ${isSending?'disabled':''}>${ico('send')}</button></div><div class="composer-foot"><span>Enter: enviar · Mayús+Enter: salto de línea</span><span>${serverMode==='local-ai'?'IA local gratuita en este computador':serverMode==='ai'?'IA conectada':'Guion interactivo de demostración'}</span></div></form></div><aside class="sim-side"><section class="panel"><div class="panel-title"><h3>Contexto clínico</h3></div><div class="side-meta"><span>Edad</span><b>${c.age} años</b></div><div class="side-meta"><span>Ocupación</span><b>${h(c.occupation)}</b></div><div class="side-meta"><span>Motivo</span><b>${h(c.topic)}</b></div><div class="side-meta"><span>Dificultad</span><b>${h(s.difficulty)}</b></div><div class="side-meta"><span>Intervenciones</span><b>${s.messages.filter(m=>m.role==='therapist').length}</b></div><div class="divider"></div><p class="help-info">${h(c.description)}</p>${s.leadInEvent?`<div class="notice" style="margin-top:12px"><b>Evento sintético entre sesiones:</b> ${h(s.leadInEvent.description||'')}</div>`:''}</section><section class="panel"><div class="panel-title"><h3>Decisiones de sesión</h3></div><div class="side-actions"><button class="btn btn-secondary" data-action="change-difficulty">${ico('filter')} Ajustar dificultad</button><button class="btn btn-secondary" data-action="next-phase">${ico('arrow')} Finalizar y avanzar fase</button><button class="btn btn-danger" data-action="finish-confirm">${ico('check')} Finalizar y evaluar</button></div>${(s.turns||[]).length?`<div class="divider"></div><div class="side-meta"><span>Última intervención</span><b>${h(s.turns.at(-1).type||'Otro')}</b></div><p class="help-info">${s.turns.at(-1).type==='Interacción no evaluable'?'Interacción social o metainstrucción: no se asigna puntuación clínica.':`Clasificación ${s.turns.at(-1).source==='ai'?'asistida por IA':'heurística'} · Puntaje ${(100*(s.turns.at(-1).quality||0)).toFixed(0)}/100 (exploratorio).`}</p>`:''}<div class="divider"></div><h3 style="font-size:13px;margin-bottom:15px">Estado dimensional simulado</h3>${dimensionBars(s.dimensions)}<div class="mode-note">${serverMode==='local-ai'?'Las respuestas son generadas en tu navegador por un modelo local gratuito, si el equipo es compatible. No son clínicamente validadas.':serverMode==='ai'?'Las respuestas del personaje son generadas por el modelo configurado. Su precisión clínica no está garantizada.':'Esta sesión gratuita usa respuestas basadas en reglas. Puedes probar IA local desde el botón superior si tu equipo y Chrome son compatibles.'}</div></section><div class="notice warning">${ico('alert',15)} Simulación para formación. No sustituye supervisión profesional, evaluación psicológica ni atención sanitaria.</div></aside></div>`}
function categorize(text,phase='Inicio de la relación'){const x=PRISMA_ENGINE.classify(text,phase);return{type:x.type,score:x.quality,delta:PRISMA_ENGINE.DELTAS[x.type]||PRISMA_ENGINE.DELTAS.Otro,quality:x.quality,...x}}
function clamp(x){return Math.max(0,Math.min(10,+x.toFixed(2)))}
function adjustDimension(s,therapistText){const cat=categorize(therapistText,s.phase);s.dimensions=PRISMA_ENGINE.nextDimensions(s.dimensions,cat,s.phase,s.difficulty,caseById(s.patientId).baseline);s.turns=s.turns||[];s.turns.push({...cat,at:new Date().toISOString()});s.trajectories=s.trajectories||[];s.trajectories.push(s.dimensions.slice());return cat}
// Nota: activación afectiva puede disminuir con una intervención facilitadora; no equivale a mejoría clínica real.
function demoReply(c,s,intervention){let t=intervention.toLowerCase(),r=c.responses;if(s.leadInEvent&&/ultima sesion|ultima vez|desde entonces|esta semana|que paso|que ocurrio|desde que nos vimos|cómo te fue|como te fue/.test(t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')))return s.leadInEvent.description+' Me quedé pensando en lo que hablamos.';if(/suicid|hacerte daño|autolesi|quitarte la vida/.test(t))return 'No he tenido pensamientos de hacerme daño. Lo que me preocupa es cómo manejar lo que me pasa y poder hablarlo.';if(/gracias|confi|acog|entiendo|sientes|valid|escucho|comprensible|difícil para ti|imagino/.test(t)&&s.messages.filter(m=>m.role==='therapist').length<=2)return 'Gracias por escucharlo de esa manera. Me cuesta hablar de esto, pero así siento un poco menos de presión.';if(/valor|importa|quisier|desea|sentido|objetivo|metas|vida que|paso pequeño|paso concreto/.test(t))return r.values;if(/hac(es|ías)|reaccion|comport|evit|conduct|respuesta|después|cuando ocurre|qué pasó luego/.test(t))return r.behavior;if(/emoci|sientes|cuerpo|sensaci|miedo|ansiedad|triste|enojo|pensabas/.test(t))return r.emotion;if(/origen|empez|antes|histori|primera vez|cuándo comenzó/.test(t))return r.past;if(/qué pasa|cuéntame|dime|hablar|situaci|ejemplo|cómo te afecta|describ/.test(t))return r.open;if(/debes|tienes que|simplemente|no es para tanto/.test(t))return s.difficulty==='Básico'?'Podría intentarlo, aunque no sé cómo empezar.':'Entiendo lo que dice, pero si fuera tan sencillo ya lo habría hecho.';let options=[r.default,r.open,r.emotion,r.behavior];let index=(intervention.length+s.messages.length)%options.length;return options[index]}
async function aiReply(c,s){let previous=closedSessions(c.id).slice(-4).map(x=>({phase:x.phase,summary:x.summary||'',event:x.event||null,date:x.ended}));let response=await fetch('/api/turn',{method:'POST',headers:{'Content-Type':'application/json','X-Prisma-Request':'1'},body:JSON.stringify({patientId:c.id,phase:s.phase,difficulty:s.difficulty,dimensions:s.dimensions,previous,messages:s.messages.slice(-36).map(m=>({role:m.role,text:m.text}))})});let payload=await response.json().catch(()=>({error:'Respuesta no válida del servidor'}));if(!response.ok)throw new Error(payload.error||`Error ${response.status}`);if(!payload.reply||typeof payload.reply!=='string')throw new Error('El modelo no devolvió una respuesta válida.');if(Array.isArray(payload.dimensions)&&payload.dimensions.length===6)s.dimensions=payload.dimensions.map(clamp);s.turns=s.turns||[];s.turns.push({...payload.classification,at:new Date().toISOString(),recallCount:payload.recallCount||0,validation:payload.validation||'unverified'});s.trajectories=s.trajectories||[];s.trajectories.push(s.dimensions.slice());return payload.reply}
async function sendMessage(raw){let text=String(raw||'').trim(),s=currentSession();if(!s||!text||isSending)return;if(text.length>1800){toast('La intervención no puede superar 1800 caracteres.',true);return}let c=caseById(s.patientId);isSending=true;s.messages.push({id:uid(),role:'therapist',text,at:new Date().toISOString()});if(serverMode!=='ai')adjustDimension(s,text);save();render();let area=document.getElementById('chat-scroll');if(area){area.scrollTop=area.scrollHeight;document.getElementById('typing')?.classList.remove('hide')};try{let reply=serverMode==='ai'?await aiReply(c,s):serverMode==='local-ai'?await localAIReply(c,s):demoReply(c,s,text);s.messages.push({id:uid(),role:'patient',text:reply.slice(0,3500),at:new Date().toISOString()})}catch(err){toast('No se pudo obtener respuesta de la IA: '+err.message,true);s.messages.push({id:uid(),role:'patient',text:'[La respuesta de IA no se generó. Revisa la conexión; tu intervención quedó registrada.]',at:new Date().toISOString()})}finally{isSending=false;save();render();let input=document.getElementById('message-input');input?.focus();let scroll=document.getElementById('chat-scroll');if(scroll)scroll.scrollTop=scroll.scrollHeight}}
function summarizeSession(s){const turns=s.turns||[],n=s.messages.filter(m=>m.role==='therapist').length,fromEngine=PRISMA_ENGINE.rubric(turns,s.phase);let measures={empatía:fromEngine.measures.empatia,exploración:fromEngine.measures.exploracion,pertinencia:fromEngine.measures.pertinencia,'formulación':fromEngine.measures.formulacion};let summary=`En la sesión ${s.number} de ${s.phase.toLowerCase()} se registraron ${n} intervenciones. Se identificaron ${turns.filter(x=>x.type==='Pregunta abierta').length} preguntas abiertas, ${turns.filter(x=>['Reflejo emocional','Validación','Paráfrasis'].includes(x.type)).length} reflejos o validaciones y ${turns.filter(x=>x.type==='Análisis funcional').length} intervenciones sobre contingencias. El caso abordó ${caseById(s.patientId).topic.toLowerCase()}.`;const strengths=[];if(turns.some(x=>['Validación','Reflejo emocional','Paráfrasis'].includes(x.type)))strengths.push('Se reconocieron verbalmente aspectos de la experiencia del consultante.');if(turns.some(x=>x.type==='Pregunta abierta'))strengths.push('Se formularon preguntas abiertas durante la entrevista.');if(turns.some(x=>x.type==='Análisis funcional'))strengths.push('Se exploraron relaciones entre antecedentes, conductas o consecuencias.');if(!strengths.length)strengths.push('Se registró el intercambio completo para su posterior revisión.');const improvements=[];if(!turns.some(x=>['Validación','Reflejo emocional'].includes(x.type)))improvements.push('Incorporar validaciones y reflejos sustentados en lo dicho por el consultante.');if(!turns.some(x=>x.type==='Análisis funcional'))improvements.push('Explorar qué antecede, mantiene y sigue a las conductas relevantes.');if(turns.some(x=>x.type==='Confrontación prematura'))improvements.push('Evitar consejos imperativos o minimizadores antes de construir una comprensión del caso.');if(!improvements.length)improvements.push('Profundizar hipótesis funcionales y contrastarlas en encuentros posteriores.');return{score:fromEngine.score,measures,summary,strengths,improvements,n,turns,method:fromEngine.method}}
function syntheticEvent(s){let patient=caseById(s.patientId),catalog={valeria:'Tuvo una reunión de trabajo y tomó notas sobre un momento en el que quiso intervenir, aunque finalmente esperó.',daniel:'Durante una tarde familiar percibió que empezaba a revisar gastos y anotó esa situación.',lorena:'Recibió una invitación para encontrarse con una amiga y dejó pendiente su respuesta.',andres:'Recibió un mensaje laboral fuera del horario y tuvo dudas sobre cómo responder.',camila:'Dedicó más tiempo de lo previsto a corregir una tarea antes de enviarla.',samuel:'Una conversación familiar despertó recuerdos de su hermano y eligió retirarse un momento.',paula:'Planeó un desplazamiento en transporte público y anticipó sensaciones físicas incómodas.',nicolas:'Conversó con su pareja sobre una decisión que ha venido aplazando.',juliana:'En una diferencia familiar notó que estaba a punto de levantar la voz.'};return{description:catalog[patient.id]||'Durante la semana ocurrió una situación cotidiana asociada al motivo de consulta.',homeworkStatus:'no_acordada',simulated:true}}
async function closeSession(advance=false){let s=currentSession();if(!s||isSending)return;s.status='closed';s.ended=new Date().toISOString();s.review=summarizeSession(s);s.summary=s.review.summary;s.event=syntheticEvent(s);s.memory={themes:[caseById(s.patientId).topic],relevant_facts:[],open_questions:[],homework:''};delete state.active[s.patientId];if(advance){let i=PHASES.indexOf(s.phase);if(i<PHASES.length-1)state.patients[s.patientId].phase=PHASES[i+1]};save();selectedSession=s.id;page='report';render();toast(advance?'Sesión cerrada y etapa avanzada.':'Sesión cerrada y evaluación disponible.');if(serverMode==='ai'&&s.messages.length>2){s.analysisStatus='processing';save();render();try{let result=await fetch('/api/close',{method:'POST',headers:{'Content-Type':'application/json','X-Prisma-Request':'1'},body:JSON.stringify({sessionId:s.id,patientId:s.patientId,phase:s.phase,messages:s.messages.map(m=>({role:m.role,text:m.text}))})});let payload=await result.json();if(!result.ok)throw new Error(payload.error||'Error de evaluación');if(typeof payload.summary==='string'&&payload.summary.length>10){s.summary=payload.summary;s.review.summary=payload.summary;if(Array.isArray(payload.strengths)&&payload.strengths.length)s.review.strengths=payload.strengths.slice(0,4).map(String);if(Array.isArray(payload.improvements)&&payload.improvements.length)s.review.improvements=payload.improvements.slice(0,4).map(String);if(payload.event)s.event=payload.event;if(payload.memory)s.memory=payload.memory;s.review.method+=' Síntesis complementaria redactada por un modelo generativo; debe contrastarse con la transcripción.'}s.analysisStatus='completed';save();if(page==='report'&&selectedSession===s.id)render();toast('Resumen y memoria contextual del encuentro actualizados.')}catch(err){s.analysisStatus='failed';save();if(page==='report')render();toast('Se guardó la evaluación local; el análisis de IA no estuvo disponible.',true)}}}
function historyView(){let ss=state.sessions.slice().sort((a,b)=>b.started.localeCompare(a.started));return header('Historial de sesiones','Revisa tus entrevistas, informes y transcripciones.',`<button class="btn btn-secondary" data-action="export">${ico('download')} Exportar respaldo</button>`)+`<div class="panel">${ss.length?`<div class="table-wrap"><table class="session-table"><thead><tr><th>Consultante</th><th>Sesión</th><th>Etapa</th><th>Fecha</th><th>Intervenciones</th><th>Estado</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td><b>${h(caseById(s.patientId).name)}</b></td><td>${s.number}</td><td>${h(s.phase)}</td><td>${dateFormat(s.started)}</td><td>${s.messages.filter(m=>m.role==='therapist').length}</td><td><span class="pill ${s.status==='closed'?'green':'orange'}">${s.status==='closed'?'Cerrada':'En curso'}</span></td><td><button data-action="${s.status==='closed'?'report':'resume'}" data-session="${s.id}">${s.status==='closed'?'Ver informe':'Continuar'}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${ico('history',32)}<b>Sin historial todavía</b><span>Las sesiones aparecerán aquí al iniciar una entrevista.</span><button class="btn btn-primary" data-action="go" data-page="library">Elegir consultante</button></div>`}</div>`}
function lineGraph(series){if(!series.length)return'';let W=680,H=245,PL=34,PR=18,PT=20,PB=36,w=W-PL-PR,hh=H-PT-PB,cols=series.map((_,i)=>PL+(series.length===1?w/2:(w*i/(series.length-1))));let lines=DIM_COLORS.map((color,j)=>{let points=series.map((row,i)=>`${cols[i]},${PT+hh-(row[j]/10*hh)}`).join(' ');return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>${series.map((row,i)=>`<circle cx="${cols[i]}" cy="${PT+hh-(row[j]/10*hh)}" r="2.7" fill="${color}"/>`).join('')}`}).join('');let ticks=[0,2,4,6,8,10].map(v=>{let y=PT+hh-(v/10*hh);return `<path d="M${PL} ${y}H${W-PR}" stroke="#e6ecf3" stroke-dasharray="3 5"/><text x="${PL-13}" y="${y+4}" font-size="10" fill="#8895a8" text-anchor="end">${v}</text>`}).join('');return `<div class="mini-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución ilustrativa de las seis dimensiones, escala de cero a diez">${ticks}${lines}${cols.map((x,i)=>`<text x="${x}" y="${H-12}" text-anchor="middle" font-size="10" fill="#8091a3">${i?'S'+i:'Base'}</text>`).join('')}</svg></div><div class="chart-legend">${DIM_NAMES.map((n,i)=>`<span><span class="legend-dot" style="background:${DIM_COLORS[i]}"></span>${n}</span>`).join('')}</div>`}
function analytics(){let options=CASES.filter(c=>closedSessions(c.id).length);let c=caseById(selectedPatient)||options[0];if(c&&!closedSessions(c.id).length)c=options[0];if(c)selectedPatient=c.id;let list=c?closedSessions(c.id):[];let data=c?[c.baseline,...list.map(s=>s.dimensions)]:[];return header('Evolución clínica','Visualización formativa de procesos y dimensiones a través de sesiones.')+(options.length?`<div class="toolbar"><div class="field" style="min-width:240px"><label for="analytics-select">Consultante</label><select class="selector" style="width:100%" id="analytics-select">${options.map(p=>`<option value="${p.id}" ${p.id===c.id?'selected':''}>${h(p.name)}</option>`).join('')}</select></div><span class="pill green">${list.length} sesiones cerradas</span></div><div class="report-grid"><section class="panel"><div class="panel-title"><h3>Evolución dimensional de ${h(c.name)}</h3></div>${lineGraph(data)}<p class="help-info">Se muestran los estados basales y de cierre estimados. Los cambios son ilustrativos y no evidencian eficacia terapéutica ni equivalen a resultados de pruebas validadas.</p></section><section class="panel"><div class="panel-title"><h3>Resumen del proceso</h3></div>${dimensionBars(data[data.length-1])}<div class="divider"></div><p class="help-info">Última etapa completada: ${h(list[list.length-1].phase)}.</p><button class="btn btn-secondary" data-action="patient" data-id="${c.id}">Ver ficha y sesiones ${ico('arrow')}</button></section></div><section class="panel" style="margin-top:18px"><div class="panel-title"><h3>Sesiones completadas</h3></div><div class="table-wrap"><table class="session-table"><thead><tr><th>Sesión</th><th>Fecha</th><th>Etapa</th><th>Intervenciones</th><th>Rúbrica</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td>#${s.number}</td><td>${dateFormat(s.ended)}</td><td>${h(s.phase)}</td><td>${s.review?.n||0}</td><td>${s.review?.score||0}/100</td><td><button data-action="report" data-session="${s.id}">Ver detalle</button></td></tr>`).join('')}</tbody></table></div></section>`:`<div class="panel"><div class="empty">${ico('chart',32)}<b>No hay datos para visualizar</b><span>Cierra una sesión para generar una primera observación de evolución.</span><button class="btn btn-primary" data-action="go" data-page="library">Ir a la biblioteca</button></div></div>`) }
function report(){let s=state.sessions.find(x=>x.id===selectedSession&&x.status==='closed');if(!s)return historyView();let c=caseById(s.patientId),r=s.review||summarizeSession(s);return header(`Informe de sesión ${s.number}`,`${c.name} · ${s.phase} · ${dateFormat(s.ended)}`,`<button class="btn btn-secondary" data-action="go" data-page="history">${ico('back')} Historial</button><button class="btn btn-secondary" data-action="download-transcript" data-session="${s.id}">${ico('download')} Descargar texto</button><button class="btn btn-primary" data-action="print">${ico('printer')} Imprimir / PDF</button>`)+`<div class="notice warning" style="margin-bottom:20px">Evaluación orientativa de entrenamiento. La puntuación se obtiene de categorías contextuales heurísticas o asistidas por IA, no de un instrumento validado ni de una calificación experta. No utilizar con pacientes reales.</div><div class="report-grid"><section class="panel"><div class="panel-title"><h3>Síntesis de la sesión</h3><span class="pill green">Completada</span></div><p class="detail-text">${h(s.summary||r.summary)}</p><div class="divider"></div><span class="eyebrow">FORTALEZAS OBSERVABLES</span><div class="detail-text">${r.strengths.map(x=>`<p>• ${h(x)}</p>`).join('')}</div><span class="eyebrow">OPORTUNIDADES DE MEJORA</span><div class="detail-text">${r.improvements.map(x=>`<p>• ${h(x)}</p>`).join('')}</div><div class="divider"></div><span class="eyebrow">EVENTO FICTICIO ENTRE SESIONES</span><p class="detail-text">${h(s.event?.description||'Pendiente de simulación.')}</p><p class="help-info">Evento generado exclusivamente para continuidad narrativa; no describe hechos reales.</p><div class="divider"></div><span class="eyebrow">OBSERVACIONES</span><p class="help-info">${h(r.method)}</p><p class="help-info">${s.analysisStatus==='processing'?'Generando resumen y memoria mediante IA…':s.analysisStatus==='failed'?'La evaluación IA no estuvo disponible.':''}</p></section><section class="panel"><div class="panel-title"><h3>Rúbrica exploratoria</h3></div><div class="review-score">${r.score}<span style="font-size:15px;color:#8fa0ac"> /100</span></div><p class="help-info">Puntuación automática ilustrativa.</p><div class="review-bars">${Object.entries(r.measures).map(([name,v])=>`<div class="review-row"><span style="text-transform:capitalize">${h(name)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${v}%"></span></span><strong>${v}</strong></div>`).join('')}</div><div class="divider"></div><p class="help-info">${r.n} intervenciones registradas · ${s.messages.length} mensajes totales</p></section></div><section class="panel" style="margin-top:17px"><div class="panel-title"><h3>Transcripción completa</h3><span class="pill">${s.messages.length} mensajes</span></div><div class="transcript">${s.messages.map(m=>`<p><b class="${m.role==='therapist'?'therapist':''}">${m.role==='therapist'?'Terapeuta':h(c.name)} · ${timeFormat(m.at)}</b><span style="display:block;margin-top:5px">${h(m.text).replace(/\n/g,'<br>')}</span></p>`).join('')}</div></section>${(s.turns||[]).length?`<section class="panel" style="margin-top:17px"><div class="panel-title"><h3>Clasificación de intervenciones</h3><span class="pill">Análisis orientativo</span></div><div class="table-wrap"><table class="session-table"><thead><tr><th>Turno</th><th>Tipo de intervención</th><th>Calidad contextual*</th><th>Fuente</th></tr></thead><tbody>${s.turns.map((t,i)=>`<tr><td>${i+1}</td><td>${h(t.type||'Otro')}</td><td>${Math.round((t.quality||0)*100)}/100</td><td>${t.source==='ai'?'Modelo IA':'Heurística'}</td></tr>`).join('')}</tbody></table></div><p class="help-info">*Cálculo no validado; revisar cada categoría con la transcripción y la supervisión académica.</p></section>`:''}`}
function settings(){return header('Configuración','Personaliza tu entorno local de práctica y administra los datos de entrenamiento.')+`<div class="detail-layout"><section class="panel"><div class="setting-section"><h4>Perfil de entrenamiento</h4><p>Este perfil se almacena en el navegador; las preferencias también se sincronizan con tu cuenta local cuando inicias sesión.</p><form id="profile-form"><div class="form-row"><div class="field"><label for="profile-name">Nombre para mostrar</label><input required id="profile-name" maxlength="70" value="${h(state.profile.name)}"></div><div class="field"><label for="profile-approach">Enfoque preferido</label><select id="profile-approach">${['ACT y análisis funcional','Cognitivo-conductual','Integrativo','Entrevista clínica general'].map(x=>`<option ${state.profile.approach===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label for="profile-difficulty">Dificultad predeterminada</label><select id="profile-difficulty">${['Básico','Intermedio','Avanzado'].map(x=>`<option ${state.profile.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div><div style="margin-top:16px"><button class="btn btn-primary">${ico('check')} Guardar preferencias</button></div></form></div><div class="setting-section"><h4>Datos y respaldos</h4><p>Exporta tus sesiones, restaura un respaldo o elimina los datos guardados en este navegador.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" data-action="export">${ico('download')} Exportar JSON</button><button class="btn btn-secondary" data-action="import">${ico('file')} Importar JSON</button><button class="btn btn-danger" data-action="delete-confirm">${ico('trash')} Borrar datos locales</button></div><input id="import-file" type="file" accept=".json,application/json" hidden></div><div class="setting-section"><h4>Seguridad y privacidad</h4><div class="notice warning">Sin cuenta, los registros se conservan en localStorage sin cifrar. Con cuenta activa, las transcripciones y sesiones se guardan cifradas con AES-256-GCM en SQLite del servidor, sin copiar esos datos a localStorage. No introduzcas nombres, historias clínicas, identificaciones ni datos sensibles de personas reales. Para producción se requiere autenticación, base de datos segura, permisos, cifrado y revisión de protección de datos.</div></div></section><aside>${accountPanel()}<section class="panel"><h3>Motor de conversación</h3><div class="divider"></div><span class="pill ${serverMode==='ai'?'green':'orange'}">${serverMode==='ai'?'Modelo de IA habilitado':'Modo demostración'}</span><p class="detail-text">${serverMode==='ai'?'Se detectó una clave válida configurada en el servidor. Las intervenciones se envían al proveedor de IA configurado.':'Sin IA conectada y cuenta activa: respuestas basadas en reglas contextuales.'}</p><p class="help-info">Para activar respuestas generativas, inicia el servidor con la variable OPENAI_API_KEY. La clave nunca debe introducirse en el navegador.</p><button class="btn btn-secondary" data-action="check-server">${ico('refresh')} Comprobar conexión</button></section><section class="panel" style="margin-top:16px"><h3>Acerca del laboratorio</h3><p class="detail-text">Prisma Clínica v2.0 es un prototipo de formación original e independiente. No está afiliado a P-Lab.</p><p class="help-info">Incluye nueve casos sintéticos, seis fases, seguimiento ilustrativo, historial y exportación. Con IA y cuenta activa incorpora recuperación semántica de memorias, clasificación y eventos ficticios; la rúbrica no está validada.</p></section></aside></div>`}
function render(){let out;switch(page){case'library':out=library();break;case'assigned':out=library(true);break;case'patient':out=patientDetail();break;case'simulation':out=simView();break;case'history':out=historyView();break;case'analytics':out=analytics();break;case'report':out=report();break;case'settings':out=settings();break;default:out=dash()}layout(out)}

function exportTranscript(id){let s=state.sessions.find(x=>x.id===id);if(!s)return;let c=caseById(s.patientId);let text=`PRISMA CLÍNICA · SIMULACIÓN FORMATIVA\nConsultante ficticio: ${c.name}\nSesión ${s.number} · ${s.phase}\nFecha: ${dateFormat(s.started)}\n\n${s.messages.map(m=>`[${timeFormat(m.at)}] ${m.role==='therapist'?'Terapeuta':c.name}: ${m.text}`).join('\n\n')}\n\nResumen orientativo: ${s.summary||''}\n\nDocumento de simulación, no historia clínica.\n`;download(`sesion-${s.number}-${c.id}.txt`,text)}
async function checkServer(silent=false){if(location.protocol==='file:'){serverMode='demo';serverAvailable=false;serverUser=null;if(!silent)toast('Archivo local: demostración sin IA, cuentas ni cifrado remoto.');render();return}try{let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),4000);let r=await fetch('/api/status',{signal:ctrl.signal});clearTimeout(timer);let data=await r.json();serverAvailable=true;const previous=serverUser?.id;serverUser=data.user||null;serverMode=data.ai&&serverUser?'ai':'demo';if(serverUser&&previous!==serverUser.id)await loadServerState();if(!silent)toast(serverMode==='ai'?'Sesión de cuenta e IA disponibles.':data.ai?'Para usar la IA, inicia sesión en tu cuenta.':'Servidor activo; sin clave API se usa la demostración.')}catch{serverAvailable=false;serverMode='demo';serverUser=null;if(!silent)toast('Servidor no disponible. Continúa el modo demostración.')}render()}
document.addEventListener('click',async ev=>{let el=ev.target.closest('[data-action]');if(!el)return;let action=el.dataset.action;switch(action){case'go':page=el.dataset.page;category='Todas';difficultyFilter='Todas';query='';render();break;case'patient':selectedPatient=el.dataset.id;page='patient';render();break;case'start':startSession(el.dataset.id);break;case'resume':{let s=state.sessions.find(x=>x.id===el.dataset.session);if(s&&s.status==='active'){selectedPatient=s.patientId;page='simulation';render()}break}case'report':selectedSession=el.dataset.session;page='report';render();break;case'finish-confirm':if(isSending)return;confirmDialog('Cerrar sesión','Se guardará la transcripción y se generará una evaluación formativa orientativa. ¿Deseas terminar la entrevista?','Cerrar y evaluar',()=>closeSession(false));break;case'next-phase':{let s=currentSession();if(!s)return;if(PHASES.indexOf(s.phase)===PHASES.length-1){toast('Ya estás en la última fase.');return}confirmDialog('Avanzar a la siguiente fase',`Se cerrará la sesión actual y el próximo encuentro comenzará en: ${PHASES[PHASES.indexOf(s.phase)+1]}.`,'Cerrar y avanzar',()=>closeSession(true));break}case'cancel-modal':hideModal();break;case'accept-modal':{let fn=modalAction;hideModal();fn?.();break}case'change-difficulty':changeDifficulty();break;case'apply-difficulty':{let s=currentSession();if(s){s.difficulty=document.getElementById('modal-difficulty').value;state.patients[s.patientId].difficulty=s.difficulty;save();toast('Dificultad actualizada.')}hideModal();render();break}case'reset-filters':category='Todas';difficultyFilter='Todas';query='';render();break;case'export':exportState();break;case'download-transcript':exportTranscript(el.dataset.session);break;case'print':window.print();break;case'check-server':checkServer();break;case'activate-local-ai':await activateLocalAI();break;case'deactivate-local-ai':localLanguageModel?.destroy?.();localLanguageModel=null;serverMode='demo';render();toast('IA local desactivada; continúa la simulación guiada sin costo.');break;case'logout':await logout();break;case'sync':await syncNow(true);break;case'import':document.getElementById('import-file')?.click();break;case'delete-confirm':confirmDialog('Borrar datos locales','Esta acción elimina todos tus perfiles, sesiones y evaluaciones de este navegador. Exporta un respaldo si quieres conservarlos.','Borrar definitivamente',()=>{state=emptyState();selectedPatient=null;selectedSession=null;save();page='dashboard';render();toast('Datos locales eliminados.')},true);break}});
document.addEventListener('input',ev=>{if(ev.target.id==='case-search'){query=ev.target.value;let pos=ev.target.selectionStart;render();let f=document.getElementById('case-search');f?.focus();f?.setSelectionRange(pos,pos)}});
document.addEventListener('change',async ev=>{if(ev.target.id==='category-select'){category=ev.target.value;render()}if(ev.target.id==='difficulty-select'){difficultyFilter=ev.target.value;render()}if(ev.target.id==='analytics-select'){selectedPatient=ev.target.value;render()}if(ev.target.id==='import-file'){let file=ev.target.files?.[0];if(!file)return;try{if(file.size>8e6)throw new Error('El archivo es demasiado grande (máximo 8 MB).');let payload=JSON.parse(await file.text());if(![1,2].includes(payload.schema)||!payload.profile||!Array.isArray(payload.sessions)||!payload.patients||!payload.active)throw new Error('Este archivo no es un respaldo válido.');if(payload.sessions.some(s=>!CASES.some(c=>c.id===s.patientId)||!Array.isArray(s.messages)||!['active','closed'].includes(s.status)))throw new Error('El respaldo contiene sesiones no compatibles.');state={...payload,schema:2};save();page='dashboard';toast('Respaldo importado correctamente.');render()}catch(err){toast('Error de importación: '+err.message,true)}}});
document.addEventListener('submit',async ev=>{if(ev.target.id==='chat-form'){ev.preventDefault();let input=document.getElementById('message-input');await sendMessage(input?.value||'')}if(ev.target.id==='profile-form'){ev.preventDefault();state.profile.name=document.getElementById('profile-name').value.trim().slice(0,70)||'Terapeuta en formación';state.profile.approach=document.getElementById('profile-approach').value;state.profile.difficulty=document.getElementById('profile-difficulty').value;save();render();toast('Preferencias guardadas.')}});
document.addEventListener('keydown',ev=>{if(ev.target.id==='message-input'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();ev.target.closest('form')?.requestSubmit()}if(ev.key==='Escape'&&document.getElementById('app-modal'))hideModal()});
checkServer(true);

// Cuenta local de desarrollo: cookie HttpOnly y estado cifrado del lado del servidor.
function accountPanel(){if(!serverAvailable)return `<section class="panel account-panel"><h3>Cuenta y almacenamiento</h3><p class="detail-text">Esta edición gratuita guarda el historial únicamente en este navegador. Puedes exportar tus datos y continuar las sesiones en este equipo. No tiene cuentas en la nube ni sincronización entre dispositivos.</p></section>`;
 if(serverUser)return `<section class="panel account-panel"><div class="panel-title"><h3>Cuenta conectada</h3><span class="pill green">Local</span></div><p class="detail-text"><b>${h(serverUser.name)}</b><br>${h(serverUser.email)}</p><p class="help-info">Tus registros se guardan cifrados en una base SQLite de este servidor. No se conservan en localStorage cuando la cuenta está activa. Última sincronización: ${h(lastSync||'Pendiente')}.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" data-action="sync">Sincronizar</button><button class="btn btn-secondary" data-action="logout">Cerrar sesión</button></div></section>`;
 return `<section class="panel account-panel"><h3>Iniciar sesión / registrarse</h3><p class="help-info">Cuentas locales del servidor de desarrollo. El modo IA y las memorias del servidor requieren iniciar sesión.</p><form id="login-form"><div class="field"><label for="login-email">Correo electrónico</label><input id="login-email" type="email" autocomplete="username" required placeholder="nombre@ejemplo.com"></div><div class="field" style="margin-top:9px"><label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" required minlength="10"></div><button class="btn btn-primary" style="margin-top:12px;width:100%">Ingresar</button></form><div class="divider"></div><details><summary style="font-weight:700;cursor:pointer;font-size:12px">Crear cuenta nueva</summary><form id="register-form" style="margin-top:13px"><div class="field"><label for="register-name">Nombre</label><input required minlength="2" maxlength="70" id="register-name"></div><div class="field" style="margin-top:10px"><label for="register-email">Correo electrónico</label><input required id="register-email" type="email" autocomplete="username"></div><div class="field" style="margin-top:10px"><label for="register-password">Contraseña (mínimo 10 caracteres)</label><input required id="register-password" minlength="10" type="password" autocomplete="new-password"></div><button class="btn btn-secondary" style="margin-top:12px">Crear cuenta</button></form></details></section>`}
async function accountRequest(url,body){let r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Prisma-Request':'1'},body:JSON.stringify(body)});let result=await r.json().catch(()=>({}));if(!r.ok)throw Error(result.error||`Error HTTP ${r.status}`);return result}
async function loadServerState(){if(!serverUser)return;const res=await fetch('/api/data',{credentials:'same-origin'});if(!res.ok)throw Error('No se pudo leer el historial del servidor');let remote=await res.json();if(remote.state?.sessions){state={...remote.state,schema:2}}else{if(state.profile.name==='Terapeuta en formación')state.profile.name=serverUser.name;await syncNow()};}
async function syncNow(notify=false){if(!serverUser)return;if(syncBusy){needsSync=true;return}syncBusy=true;try{await accountRequest('/api/data',{state});lastSync=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});if(notify)toast('Datos de entrenamiento sincronizados y cifrados en el servidor.')}catch(e){if(notify)toast('No se pudo sincronizar: '+e.message,true)}finally{syncBusy=false;if(needsSync){needsSync=false;setTimeout(()=>syncNow(),100)}}}
async function submitAccount(ev){ev.preventDefault();const form=ev.target;const registering=form.id==='register-form';const payload=registering?{name:document.getElementById('register-name').value.trim(),email:document.getElementById('register-email').value.trim(),password:document.getElementById('register-password').value}:{email:document.getElementById('login-email').value.trim(),password:document.getElementById('login-password').value};try{const r=await accountRequest(registering?'/api/auth/register':'/api/auth/login',payload);serverUser=r.user;await loadServerState();toast('Cuenta conectada. El historial se almacena cifrado en este servidor.');await checkServer(true)}catch(e){toast('No se pudo acceder: '+e.message,true)}}
async function logout(){try{clearTimeout(syncTimer);await syncNow();await accountRequest('/api/auth/logout',{});serverUser=null;serverMode='demo';lastSync='';try{state=JSON.parse(localStorage.getItem(STORAGE)||'null')||emptyState()}catch{state=emptyState()}page='dashboard';selectedPatient=null;selectedSession=null;toast('Sesión cerrada: el historial de esa cuenta ya no está visible.');render()}catch(e){toast('No se pudo cerrar la sesión: '+e.message,true)}}
document.addEventListener('submit',ev=>{if(['register-form','login-form'].includes(ev.target.id))submitAccount(ev)});


// Opción gratuita y opcional de generación de texto local, sin API ni transmisión a un servidor.
// No disponible en todos los navegadores o equipos. Requiere interacción explícita del usuario.
async function activateLocalAI(){
 if(localAITurningOn)return;
 if(!('LanguageModel' in window)){toast('La IA local no está disponible en este navegador/equipo. Puedes continuar gratuitamente con el simulador guiado.',true);return;}
 localAITurningOn=true;
 try{
  const availability=await window.LanguageModel.availability();
  if(availability==='unavailable')throw new Error('La IA integrada de Chrome no está disponible en este equipo.');
  toast(availability==='available'?'Activando IA local del navegador...':'Chrome necesita descargar un modelo de IA antes de comenzar. Esto puede consumir espacio en disco.');
  // Chrome requiere activación del usuario para crear modelos locales; se llama desde el botón.
  localLanguageModel=await window.LanguageModel.create({monitor(m){m.addEventListener('downloadprogress',e=>{const pct=Math.round(e.loaded*100);if(pct===100)toast('Modelo de IA local descargado.');});}});
  serverMode='local-ai';render();toast('IA local activa: práctica generativa sin API de pago.');
 }catch(err){serverMode='demo';localLanguageModel=null;render();toast('No se pudo activar IA local: '+String(err.message||err),true)}finally{localAITurningOn=false;}
}
async function localAIReply(c,s){
 if(!localLanguageModel)return demoReply(c,s,s.messages.at(-1)?.text||'');
 const prior=closedSessions(c.id).slice(-2).map(x=>x.summary||'').join(' | ');
 const transcript=s.messages.slice(-12).map(m=>(m.role==='patient'?'CONSULTANTE':'TERAPEUTA')+': '+m.text).join('\n');
 const instructions=`Eres un consultante adulto completamente FICTICIO interpretado para formar psicoterapeutas. Hablas siempre en español natural de Colombia, en primera persona como el consultante. No eres el terapeuta ni describes tu propio rol. Identidad: ${c.name}, ${c.age} años; ocupación ${c.occupation}; motivo ${c.topic}; historia ${c.history}; contexto ${c.context}. Etapa ${s.phase}, nivel ${s.difficulty}. Continuidad relevante: ${prior||'Primera entrevista'}. Responde al último turno del terapeuta con 1 a 4 frases naturales, congruentes con tu historia, sin hacer listas ni dar consejos clínicos, sin diagnósticos nuevos, sin declarar que eres una IA. Revela aspectos gradualmente. En caso de preocupación por autolesión describe tu estado ficticio sin detalles gráficos. Conversación:\n${transcript}\nCONSULTANTE:`;
 try{const text=await localLanguageModel.prompt(instructions);return String(text||'').trim()||demoReply(c,s,s.messages.at(-1)?.text||'')}
 catch(err){toast('IA local no pudo responder; se usó guion de respaldo.',true);return demoReply(c,s,s.messages.at(-1)?.text||'')}
}

<script>
/* Prisma Clínica — conversación 3.0 (cliente puro, sin claves ni facturación)
 * Los perfiles son completamente sintéticos. No es un instrumento clínico validado.
 * IA: Prompt API integrada de Chrome o WebLLM WebGPU, ambas opcionales y locales.
 */
'use strict';
let prismaWebLLM = null;
let prismaEngineType = null;
let prismaLoading = false;
let prismaProgress = '';
let prismaModelChoice = 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC';

const prismaNorm = s => String(s||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const prismaSay = (c,k) => (c.responses && c.responses[k]) || c.opening;
const prismaOwnWords = text => text.replace(/^(bueno|pues|mira|es que)[,\s]*/i, '').replace(/[.!?]+$/,'');

 work:/(trabajo|jefe|labor|oficina|companer|empleo|universidad|estudi)/.test(t),
 family:/(familia|hijo|pareja|esposa|esposo|padre|papa|mama|herman|casa|amigos)/.test(t),
 time:/(hace cuanto|cuanto tiempo|desde cuando|cuando (comenzo|empezo)|primera vez|desde que)/.test(t),
 emotion:/(sientes|emocion|emocional|angustia|ansiedad|tristeza|miedo|preocupa|molesta|te afecta|te duele)/.test(t),
 cognition:/(piensas|pensamiento|pasa por (tu|la) (mente|cabeza)|te dices|crees que|que imaginas|anticipas)/.test(t),
 behavior:/(haces|hiciste|reaccion|evitas|evitaste|respondiste|cuando ocurre|despues|conducta|dejas de hacer|como afrontas)/.test(t),
 example:/(ejemplo|situacion concreta|ultima vez|algo (que haya pasado|especifico)|describe)/.test(t),
 value:/(importa|valoras|valores|gustaria|quisieras|quisieses|objetivos|metas|cambiar|lograr|ser diferente)/.test(t),

 safety:/(suicid|autoles|lastimarte|hacerte dano|morir|quitarte la vida)/.test(t),

function prismaGuidedReply(c,s,intervention) {

 const isAdvanced=s.difficulty==='Avanzado';
 const lines=[];
 if(f.safety)return 'No he tenido pensamientos de quitarme la vida ni de hacerme daño. Lo que me está costando es manejar lo que me pasa en el día a día.';
 if(f.greeting && !f.checkin && q.length<38) return turns<=2
  ? `Hola. Gracias por recibirme. ${c.opening}`
  : 'Hola. Gracias por preguntar. Me gustaría seguir hablando de lo que me está pasando.';
 if(f.checkin)return turns<=2
  ? `Pues, un poco ${tired} de darle tantas vueltas a las cosas. ${r.emotion}`

 if(f.previous && s.leadInEvent)return `${s.leadInEvent.description} Al pensarlo, me di cuenta de que sigo reaccionando parecido.`;
 if(f.reason)return `${c.opening} ${turns>2?'Me preocupa que esto se vuelva más difícil de manejar.':''}`.trim();
 if(f.example){let text=r.behavior;return `Por ejemplo, hace poco me pasó algo parecido. ${text} Después me quedé pensando en eso bastante tiempo.`;}
 if(f.time)return `${r.past} No recuerdo una fecha exacta, pero sí que se fue volviendo algo habitual.`;
 if(f.family){const text=c.context||'';return `${text} ${r.values}`.trim();}
 if(f.work)return `En el trabajo me pasa seguido. ${r.open}`;
 if(f.cognition)return `${r.open} Y aunque intento decirme que estoy exagerando, la preocupación vuelve.`;
 if(f.behavior)return `${r.behavior} Al principio siento un alivio, pero después todo vuelve.`;
 if(f.emotion)return `${r.emotion} Hay momentos en que ni siquiera sé explicarlo bien.`;
 if(f.value)return `${r.values} Es algo que me importa, aunque no sé todavía cómo dar ese paso.`;
 if(f.validation)return `Gracias por decirlo así. ${r.default}`;
 if(f.intrusive)return isAdvanced?`Me cuesta escucharlo de ese modo, porque lo he intentado y no me resulta tan sencillo. ${r.default}`:'Podría intentarlo, pero necesitaría saber cómo hacerlo sin sentirme tan abrumado.';
 const candidates=[r.open,r.emotion,r.behavior,r.past,r.values,r.default];
 const fresh=candidates.find(line=>!used.has(prismaNorm(line)));
 if(f.closed&&turns<4)return `Creo que sí, aunque no lo tengo del todo claro. ${fresh||r.default}`;
 if(f.closed&&turns>=4)return `No siempre. ${fresh||r.default}`;
 if (q.length<7) return `¿Podría preguntármelo de otra forma? Me cuesta un poco ubicar a qué se refiere.`;
 return fresh?`A ver... ${fresh}`:`Me sigue pasando algo parecido. ${r.default}`;
}

 }finally{

 }
};

   analysisStatus:['completed','failed','processing'].includes(src.analysisStatus)?src.analysisStatus:null
  };
  if(d.status==='closed'){
   // Una puntuación incluida en un respaldo nunca se introduce en el DOM.
   // Recomputamos el informe a partir de intervenciones normalizadas.
   const evalData=summarizeSession(d);
   d.review={score:prismaNumber(evalData.score,0,0,100),n:prismaNumber(evalData.n,0,0,420),
     measures:Object.fromEntries(Object.entries(evalData.measures||{}).map(([k,v])=>[prismaText(k,60),prismaNumber(v,0,0,100)])),
     summary:d.summary||prismaText(evalData.summary,4500),
     strengths:(evalData.strengths||[]).slice(0,10).map(t=>prismaText(t,500)),
     improvements:(evalData.improvements||[]).slice(0,10).map(t=>prismaText(t,500)),
     method:prismaText(evalData.method||'',800)};
   d.summary=d.review.summary;
  }else{d.review=null;d.ended=null}
  return d;
 });
 const known=new Set(sessions.map(s=>s.id)),active={};
 for(const [key,value] of Object.entries(input.active)){
  if(!caseById(key)||!known.has(value))throw Error('Referencia activa no válida');
  const match=sessions.find(t=>t.id===value&&t.patientId===key&&t.status==='active');
  if(!match)throw Error('Sesión activa incoherente');active[key]=value;
 }
 const patients={};
 for(const [id,obj] of Object.entries(input.patients)){
  if(!caseById(id)||!obj||!PHASES.includes(obj.phase)||!['Básico','Intermedio','Avanzado'].includes(obj.difficulty))throw Error('Perfil de consultante inválido');
  patients[id]={phase:obj.phase,difficulty:obj.difficulty};
 }
 return {schema:2,profile:{name:prismaText(input.profile.name,70)||'Terapeuta en formación',
  approach:['ACT y análisis funcional','Cognitivo-conductual','Integrativo','Entrevista clínica general'].includes(input.profile.approach)?input.profile.approach:'ACT y análisis funcional',
  difficulty:['Básico','Intermedio','Avanzado'].includes(input.profile.difficulty)?input.profile.difficulty:'Intermedio'},
  sessions,patients,active};
}
// Se aplica al historial existente antes del primer uso y a respaldos importados.
try{
 if(state.sessions.length){state=prismaNormalizeBackup(state);save()}
}catch(err){
 // Conservar respaldo original ante incompatibilidad sin ejecutar su contenido.
 try{localStorage.setItem('prisma-clinica-copia-seguridad-pendiente',JSON.stringify(state))}catch{}
 state=emptyState();save();console.warn('Respaldo local incompatible; se preservó una copia para recuperación',err);
}

// Enfoque profesional: accesibilidad del teclado, diálogos modales y rutas navegables.
let prismaFocusOrigin=null, prismaRestoringRoute=false, prismaInitialRoute=true;
const prismaDialogFocusable='button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const prismaOriginalConfirmDialog=confirmDialog;
confirmDialog=function(...args){prismaFocusOrigin=document.activeElement;prismaOriginalConfirmDialog(...args);};
const prismaOriginalChangeDifficulty=changeDifficulty;
changeDifficulty=function(...args){prismaFocusOrigin=document.activeElement;prismaOriginalChangeDifficulty(...args);document.querySelector('#modal-difficulty')?.focus()};
const prismaOriginalHideModal=hideModal;
hideModal=function(...args){prismaOriginalHideModal(...args);const previous=prismaFocusOrigin;prismaFocusOrigin=null;
 if(previous?.isConnected)previous.focus();else document.getElementById('main-content')?.focus({preventScroll:true});
};
document.addEventListener('keydown',ev=>{
 const modal=document.querySelector('#app-modal [role="dialog"]');if(!modal)return;
 if(ev.key==='Tab'){
  const focusable=[...modal.querySelectorAll(prismaDialogFocusable)].filter(el=>el.getClientRects().length);
  if(!focusable.length){ev.preventDefault();modal.focus();return}
  const first=focusable[0],last=focusable.at(-1);
  if(ev.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){ev.preventDefault();last.focus()}
  else if(!ev.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){ev.preventDefault();first.focus()}
 }
},true);
function prismaRoute(){
 if(page==='patient'&&caseById(selectedPatient))return '#/patient/'+encodeURIComponent(selectedPatient);
 if(page==='simulation'&&currentSession())return '#/simulation/'+encodeURIComponent(selectedPatient);
 if(page==='report'&&selectedSession)return '#/report/'+encodeURIComponent(selectedSession);
 return '#/'+(page||'dashboard');
}
function prismaApplyRoute(){
 const raw=location.hash;
 if(!raw.startsWith('#/'))return;
 let match=/^#\/(dashboard|library|assigned|history|analytics|settings|patient|simulation|report)(?:\/([a-z0-9-]{1,155}))?$/.exec(raw);
 if(!match)return;
 let [_,p,id]=match;
 if(p==='patient'&&caseById(id)){selectedPatient=id;page=p}
 else if(p==='simulation'&&caseById(id)&&activeSession(id)){selectedPatient=id;page=p}
 else if(p==='report'&&state.sessions.some(s=>s.id===id&&s.status==='closed')){selectedSession=id;page=p}
 else if(['dashboard','library','assigned','history','analytics','settings'].includes(p))page=p;
 else page='library';
 prismaRestoringRoute=true;render();prismaRestoringRoute=false;
}
const prismaOriginalRender=render;
render=function(){
 prismaOriginalRender();
 const current=prismaRoute();
 if(prismaInitialRoute){prismaInitialRoute=false;if(location.hash.startsWith('#/')){prismaApplyRoute();return}window.history.replaceState({},'',current)}
 else if(!prismaRestoringRoute&&location.hash!==current)window.history.pushState({},'',current);
 const main=document.getElementById('main-content');main?.setAttribute('tabindex','-1');
 document.querySelectorAll('.nav-item.active,.mobile-nav button.on').forEach(b=>b.setAttribute('aria-current','page'));
 document.title=(document.querySelector('.page-title')?.textContent?.trim()||'Prisma Clínica')+' | Prisma Clínica';
 document.querySelector('.sidebar')?.setAttribute('aria-label','Menú principal');
};
window.addEventListener('popstate',prismaApplyRoute);
window.addEventListener('hashchange',prismaApplyRoute);
if(location.hash.startsWith('#/'))prismaApplyRoute();else render();

<script>
/* Prisma Clínica 3.3 — filtro de coherencia de roles y continuidad verificable.
 * Cambia solo nuevos mensajes. Los registros anteriores no se alteran automáticamente.
 * Los puntajes y respuestas son educativos, no clínicamente validados.
 */
'use strict';
function prismaClearlyWrongRole(reply,c){
 const t=prismaNorm(reply),first=prismaNorm(c?.name||'').split(' ')[0];
 return /\b(en que (puedo|podria) (ayudarte|apoyarte|servirte|orientarte)|como (puedo|podria) (ayudarte|apoyarte|orientarte)|que (te preocupa|necesitas) (hoy|ahora)|estoy aqui para (ayudarte|apoyarte|escucharte)|te ofrezco (apoyo|terapia)|soy (tu|su) (terapeuta|psicologo|psicologa)|puedo ayudarte a (entender|superar|gestionar)|te recomiendo que|te sugiero que|mi paciente|mi consultante|como (tu |su )?terapeuta|gracias por confiar en mi|me alegro de haberte conocido)\b/.test(t)||
 /\b(como puedo (colaborarte|servirte)|en que puedo (apoyarte|colaborarte)|estoy para (escucharte|apoyarte)|soy tu consejer[oa]|intentare ayudarte|como consej[oa]|me alegra (que hayas venido|haberte recibido|que estes aqui))\b/.test(t)||
 !!(first&&new RegExp('(?:^|[¡¿\\s])(?:hola|buenas)[,!. ]+'+first+'(?:[\\s!?.]|$)','i').test(t));
}
const prismaPreviousRoleValidator=prismaInvalidConsultantReply;
prismaInvalidConsultantReply=function(reply,userText,c){
 if(prismaPreviousRoleValidator(reply,userText,c))return true;
 const raw=String(reply||'').trim(),t=prismaNorm(raw);
 if(prismaClearlyWrongRole(raw,c))return true;
 // Rechazar discurso de quien conduce la entrevista, incluidas variaciones no previstas.
 if(/\b(ayudarte|apoyarte|orientarte|asesorarte|escucharte|aconsejarte|acompanarte|guiarte|brindarte apoyo|tomar decisiones por ti|ofrecerte herramientas|explorar tus emociones|entender tus sentimientos|quiero escucharte|cuentame (tu|que)|te escucho|dime (que|como) te sientes|quisiera (saber|preguntarte) como te sientes|para ayudarte|puedo ayudarte)\b/.test(t))return true;
 if(/\b(terapeuta|psicolog[oa]|como consejer[oa]|consulta psicologica|plan de tratamiento|te propongo|vamos a trabajar|como tu asesor)\b/.test(t)&&!/\b(mi terapeuta|la psicologa me|mi psicologo|venir a terapia|no se si necesito terapia)\b/.test(t))return true;
 if(/^(hola|buenas)[,!. ]+(?:[a-z]+[,!. ]+)?(como (estas|te sientes|te encuentras)|en que|que te)/.test(t))return true;
 if(/\b(que tal estas|que te preocupa|que necesitas de mi|como te gustaria que te ayudara|quieres que (hablemos|exploremos)|te gustaria (que|explorar)|en que puedo apoyarte)\b/.test(t))return true;
 // La respuesta del personaje debe expresar su propia vivencia, no solo asumir la voz de un asistente.
 const personal=/\b(yo|me|mi|mis|estoy|siento|pienso|tengo|temo|evito|quiero|quisiera|necesito|creo|recuerdo|hago|hice|estuve|fui|llevo|vengo|antes|ultimamente|a veces|desde|cuando|porque|no se|no tengo|me cuesta|prefiero|suelo|noto|algo me|para mi|no quiero|siempre)\b/.test(t);
 if(!personal)return true;
 if((raw.match(/\?/g)||[]).length>1)return true;
 // Conservar el escenario sintético sin permitir que la IA invente un riesgo distinto.
 if(/\b(suicid|autoles|matarme|lastimarme|quitarme la vida|no despertar|no querer vivir|morirme|ganas de morir)\b/.test(t))return true;
 return false;
};

prismaSystemPrompt=function(c,s){
 const name=c.name,prior=closedSessions(c.id).slice(-2).map(x=>x.summary||'').join(' ').slice(0,750);
 const examples=PRISMA_CASE_DETAILS[c.id]||PRISMA_CASE_DETAILS.valeria;
 return `SIMULACIÓN EDUCATIVA DE UN CONSULTANTE FICTICIO. Eres exclusivamente ${name}, ${c.age} años, ${c.occupation}, una persona que ha ido A CONSULTA. La persona que escribe es el psicólogo que TE entrevista. Tu trabajo NO es ofrecer ayuda ni consejos: únicamente responder como ${name} a lo que te preguntan.\nIDENTIDAD: ${c.context}. Motivo: ${c.topic}. Antecedentes: ${c.history}. Pensamientos: ${c.responses.open}. Emociones: ${c.responses.emotion}. Conductas: ${c.responses.behavior}. Objetivos: ${c.responses.values}. Dificultad: ${s.difficulty}. Etapa: ${s.phase}. Sesiones anteriores: ${prior||'Ninguna'}.\nESTILO OBLIGATORIO: usa la primera persona, habla de tus experiencias, dudas y temores. Contesta la última intervención del psicólogo con una o dos frases naturales, específicas y breves (máximo 70 palabras). No hagas preguntas al profesional salvo para aclarar algo. No llames al terapeuta por tu propio nombre. No ofrezcas tratamiento, herramientas, apoyo emocional ni asistencia al terapeuta. No escribas '¿en qué puedo ayudarte?' ni términos de asistente virtual.\nEJEMPLO de diálogo válido entre roles: TERAPEUTA: Hola, ¿cómo estás? / ${name}: ${examples.greet?.[0]||c.opening}. TERAPEUTA: ¿Me cuentas una situación concreta? / ${name}: ${examples.example?.[0]||c.responses.behavior}.\nDa exclusivamente la respuesta hablada por ${name} y no añadas etiquetas, introducciones, ni el turno del terapeuta. No inventes diagnóstico, planes de suicidio, historia personal ajena al perfil ni detalles de métodos de autolesión.`;
};

// Filtro central de salida de todos los modelos locales; no se presenta una respuesta no segura como consultante.
localAIReply=async function(c,s){
 const question=prismaLatest(s,'therapist');
 const intent=prismaOutputIntent(question);
 if(['greet','rol','safety'].includes(intent)||prismaContextualSafety(s,question))return prismaNextReply(c,s,question);
 // El modelo no puede usar como ejemplos respuestas de sesiones pasadas que invierten los roles.
 const safeHistory=(s.messages||[]).filter(m=>m.role==='therapist'||!prismaInvalidConsultantReply(m.text,'',c));
 const safeSession={...s,messages:safeHistory};
 let result='';
 try{result=await prismaFormerLocalAI(c,safeSession)}
 catch(e){console.warn('Modelo local no disponible',e)}
 if(prismaInvalidConsultantReply(result,question,c)){
   toast('Se bloqueó una respuesta de IA fuera del rol. Se mostró una respuesta coherente con el consultante.',true);
   return prismaNextReply(c,s,question);
 }
 return result;
};

// En sesiones antiguas con errores, hacer visible el problema sin borrar ni reescribir la transcripción.
function prismaWrongOldReplies(s,c){
 return (s.messages||[]).slice(1).filter(m=>m.role==='patient'&&prismaClearlyWrongRole(m.text,c)).length;
}
const prismaSimBeforeRoleRepair=simView;
simView=function(){
 let markup=prismaSimBeforeRoleRepair(),s=currentSession();
 if(!s)return markup;
 const c=caseById(s.patientId),bad=prismaWrongOldReplies(s,c);
 if(bad){
  const banner=`<div class="prisma-history-warning" role="status"><div><strong>Esta entrevista contiene ${bad} respuesta${bad===1?'':'s'} anterior${bad===1?'':'es'} fuera de rol.</strong><span>La corrección se aplica a mensajes nuevos. Puedes reiniciar solamente esta entrevista; los demás casos y sesiones no se modificarán.</span></div><button type="button" data-action="prisma-reset-chat">Reiniciar diálogo</button></div>`;
  markup=markup.replace('<div class="sim-shell">',banner+'<div class="sim-shell">');
 }
 return markup;
};
const prismaRoleCSS=document.createElement('style');prismaRoleCSS.textContent=`
.prisma-history-warning{background:#fff7ed;border:1px solid #e6b989;border-radius:11px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#67441b;margin:0 0 12px}
.prisma-history-warning strong{display:block;font-size:13px}
.prisma-history-warning span{display:block;color:#795c38;font-size:12px;line-height:1.5;margin-top:3px}
.prisma-history-warning button{background:white;color:#6c461e;border:1px solid #aa7742;border-radius:8px;font-size:12px;padding:11px 14px;min-height:44px;font-weight:700;cursor:pointer;white-space:nowrap}
@media(max-width:650px){.prisma-history-warning{align-items:stretch;flex-direction:column}.prisma-history-warning button{white-space:normal}}
`;document.head.appendChild(prismaRoleCSS);

document.addEventListener('click',e=>{
 const btn=e.target.closest('[data-action="prisma-reset-chat"]');if(!btn)return;
 const s=currentSession();if(!s)return;
 confirmDialog('Reiniciar solo esta entrevista','Se eliminarán los mensajes de esta entrevista activa para comenzar desde cero. Los demás consultantes y sesiones anteriores permanecerán intactos. Puedes exportar un respaldo antes si necesitas conservar este diálogo.','Reiniciar entrevista',()=>{
  const c=caseById(s.patientId);
  s.messages=[{id:uid(),role:'patient',text:c.opening,at:new Date().toISOString()}];
  s.turns=[];
  s.dimensions=(Array.isArray(s.trajectories?.[0])?s.trajectories[0]:c.baseline).slice();
  s.trajectories=[s.dimensions.slice()];
  s.leadInEvent=null;
  save();render();toast('Entrevista reiniciada. El consultante conserva su rol.');
 });
},true);
</script>
